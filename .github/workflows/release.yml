name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release zip
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="opencode-go-usage-monitor-v${VERSION}.zip"
          zip -r "dist/${ZIP_NAME}" \
            manifest.json \
            LICENSE \
            README.md \
            icons/icon-48.png \
            icons/icon-128.png \
            content_scripts/calculation.js \
            content_scripts/analyzer.js \
            content_scripts/ui.js \
            content_scripts/main.js
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION }}"
          body: |
            ## OpenCode Go Usage Monitor v${{ env.VERSION }}

            Download the `.zip` below, unzip it, and load it as an unpacked extension in Brave/Chrome/Edge.
          files: dist/${{ env.ZIP_NAME }}
          generate_release_notes: true
